name: Keep backend warm

# Render's free tier spins the service down after ~15 min idle; a cold start makes the
# first login take up to ~50s. /warmup also opens the DB connection, so the next
# request is fast. Note: /warmup only exists on the branch Render deploys.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://atossa-backend.onrender.com/warmup
